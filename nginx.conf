# ============================================================
#  LTIC SARL — Nginx Reverse Proxy Config
#  Place this file at: /etc/nginx/sites-available/ltic-sarl
#  Then: sudo ln -s /etc/nginx/sites-available/ltic-sarl /etc/nginx/sites-enabled/
#        sudo nginx -t && sudo systemctl reload nginx
#
#  SSL is managed by Certbot (Let's Encrypt — FREE):
#    sudo apt install certbot python3-certbot-nginx
#    sudo certbot --nginx -d yourdomain.com -d www.yourdomain.com
# ============================================================

# Redirect HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name yourdomain.com www.yourdomain.com;
    return 301 https://$host$request_uri;
}

# Main HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name yourdomain.com www.yourdomain.com;

    # SSL — Certbot fills these in automatically
    ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers (Next.js adds its own, Nginx adds transport-level ones)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Upload file size limit — must match NestJS multer limit (100MB)
    client_max_body_size 110M;

    # ── API: proxy /api/* and /uploads/* to NestJS ──────────
    location /api/ {
        proxy_pass         http://127.0.0.1:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
    }

    location /uploads/ {
        proxy_pass         http://127.0.0.1:4000/uploads/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_cache_bypass $http_upgrade;
        # Cache uploaded images for 7 days
        proxy_cache_valid  200 7d;
        add_header         Cache-Control "public, max-age=604800, immutable";
    }

    # ── SSE (Server-Sent Events) — disable buffering ────────
    location /api/notifications/stream {
        proxy_pass         http://127.0.0.1:4000/api/notifications/stream;
        proxy_http_version 1.1;
        proxy_set_header   Connection '';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # ── Frontend: proxy everything else to Next.js ──────────
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # ── Next.js static assets — cache aggressively ──────────
    location /_next/static/ {
        proxy_pass  http://127.0.0.1:3000/_next/static/;
        add_header  Cache-Control "public, max-age=31536000, immutable";
    }
}
